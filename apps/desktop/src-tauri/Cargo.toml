[package]
name = "workforce-desktop"
version = "0.1.0"
edition = "2021"
description = "Workforce office desktop app"
license = "UNLICENSED"
publish = false

[lib]
name = "workforce_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
print-spooler = { path = "../print-spooler" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
